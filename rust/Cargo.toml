[package]
name = "ytapis"
version = "2.0.0"
edition = "2021"
description = "Search YouTube and get video metadata — no API key required"
license = "MIT"
authors = ["geethudinoyt", "geethudino (Ruthvik)"]
repository = "https://github.com/pgboyahpgr-commits/ytapis"
keywords = ["youtube", "search", "scraper", "metadata"]

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "ytapis"
path = "src/main.rs"
