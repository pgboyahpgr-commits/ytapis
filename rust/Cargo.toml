[package]
name = "ytapis"
version = "1.0.0"
edition = "2021"
description = "YouTube search engine - scrape results, InnerTube continuation, oEmbed fallback"
authors = ["geethudino (Ruthvik)"]
license = "MIT"

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "json", "cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "ytapis"
path = "src/main.rs"
