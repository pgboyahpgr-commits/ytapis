syntax = "proto3";
package ytapis;

message Thumbnail { string url = 1; int32 width = 2; int32 height = 3; }
message VideoResult {
  string id = 1; string title = 2; string author = 3; string channel_url = 4;
  string thumbnail = 5; repeated Thumbnail thumbnails = 6;
  string full_url = 7; string embed_url = 8;
  string duration = 9; int32 duration_seconds = 10;
  string view_count = 11; int64 view_count_raw = 12;
  string published_time = 13; string description = 14; string channel_avatar = 15;
  bool is_live = 16; bool is_upcoming = 17; bool is_verified = 18;
}
message SearchRequest { string query = 1; int32 limit = 2; string continuation = 3; }
message SearchResponse { repeated VideoResult results = 1; string continuation = 2; }

message VideoRequest { string video_id = 1; int32 limit = 2; string sort_by = 3; string continuation = 4; }
message CommentAuthor { string name = 1; string channel_id = 2; string avatar = 3; bool is_verified = 4; }
message CommentReply { string id = 1; CommentAuthor author = 2; string text = 3; int32 like_count = 4; string published_time = 5; }
message VideoComment { string id = 1; CommentAuthor author = 2; string text = 3; int32 like_count = 4; int64 like_count_raw = 5; string published_time = 6; int32 reply_count = 7; bool is_pinned = 8; repeated CommentReply replies = 9; string reply_continuation = 10; }
message CommentsResponse { repeated VideoComment comments = 1; string continuation = 2; }

message RelatedVideo { string id = 1; string title = 2; string author = 3; string duration = 4; int32 duration_seconds = 5; string view_count = 6; string published_time = 7; string thumbnail = 8; }
message RelatedResponse { repeated RelatedVideo videos = 1; }

message LiveStreamInfo { bool is_live = 1; int32 viewer_count = 2; string viewer_count_str = 3; string start_time = 4; int32 likes_count = 5; }
message VideoStats { int64 views = 1; int64 likes = 2; int64 comments = 3; }

service Ytapis {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc GetVideo(VideoRequest) returns (VideoResult);
  rpc GetTrending(SearchRequest) returns (SearchResponse);
  rpc SearchChannel(SearchRequest) returns (SearchResponse);
  rpc SearchPlaylist(SearchRequest) returns (SearchResponse);
  rpc GetComments(VideoRequest) returns (CommentsResponse);
  rpc GetRelatedVideos(VideoRequest) returns (RelatedResponse);
  rpc GetVideoStats(VideoRequest) returns (VideoStats);
  rpc GetLiveStreamInfo(VideoRequest) returns (LiveStreamInfo);
}
