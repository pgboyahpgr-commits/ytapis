<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ytapis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px; font-family: 'Roboto', Arial, sans-serif; font-size: 13px;
      background: #1e1e1e; color: #fff; padding: 0;
    }
    .popup-header {
      display: flex; align-items: center; padding: 12px 14px; background: #111;
      border-bottom: 1px solid #333;
    }
    .popup-logo { color: #ff0000; font-size: 18px; font-weight: 900; margin-right: 8px; }
    .popup-brand { font-weight: 700; font-size: 15px; }
    .popup-search-container { padding: 12px 14px; display: flex; gap: 8px; }
    .popup-search-input {
      flex: 1; padding: 8px 12px; border: 1px solid #444; border-radius: 20px;
      background: #111; color: #fff; font-size: 13px; outline: none;
      transition: border-color 0.15s;
    }
    .popup-search-input:focus { border-color: #ff4444; }
    .popup-search-input::placeholder { color: #888; }
    .popup-search-btn {
      padding: 8px 16px; background: #ff0000; color: #fff; border: none;
      border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 13px;
      transition: background 0.15s;
    }
    .popup-search-btn:hover { background: #cc0000; }
    .popup-search-btn:disabled { background: #555; cursor: not-allowed; }
    .popup-results { max-height: 350px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #555 #1e1e1e; }
    .popup-results::-webkit-scrollbar { width: 6px; }
    .popup-results::-webkit-scrollbar-track { background: #1e1e1e; }
    .popup-results::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
    .popup-result {
      display: flex; gap: 10px; padding: 10px 14px; cursor: pointer;
      border-bottom: 1px solid #2a2a2a; transition: background 0.1s;
    }
    .popup-result:hover { background: #252525; }
    .popup-result-thumb {
      width: 120px; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px;
      background: #2a2a2a; flex-shrink: 0;
    }
    .popup-result-info { min-width: 0; }
    .popup-result-title { font-size: 13px; font-weight: 500; line-height: 1.3; margin-bottom: 4px; }
    .popup-result-channel { font-size: 11px; color: #aaa; }
    .popup-result-meta { font-size: 11px; color: #888; margin-top: 2px; }
    .popup-empty {
      text-align: center; padding: 40px 20px; color: #888;
    }
    .popup-empty-icon { font-size: 32px; margin-bottom: 8px; }
    .popup-loading {
      text-align: center; padding: 30px 20px; color: #888;
    }
    .popup-error { color: #ff4444; text-align: center; padding: 20px; }
    .popup-footer {
      padding: 8px 14px; text-align: center; font-size: 10px; color: #555;
      border-top: 1px solid #2a2a2a;
    }
    .ytp-shimmer {
      background: linear-gradient(90deg, #2a2a2a 25%, #333 50%, #2a2a2a 75%);
      background-size: 200% 100%; animation: ytp-shimmer 1.5s infinite; border-radius: 4px;
    }
    @keyframes ytp-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body>
  <div class="popup-header">
    <span class="popup-logo">▶</span>
    <span class="popup-brand">ytapis Search</span>
  </div>
  <div class="popup-search-container">
    <input type="text" class="popup-search-input" id="search-input" placeholder="Search YouTube..." autofocus>
    <button class="popup-search-btn" id="search-btn">Search</button>
  </div>
  <div class="popup-results" id="results-container">
    <div class="popup-empty">
      <div class="popup-empty-icon">🔍</div>
      <div>Search for videos above</div>
    </div>
  </div>
  <div class="popup-footer">ytapis v1.0 — YouTube Metadata</div>
  <script src="popup.js"></script>
</body>
</html>
