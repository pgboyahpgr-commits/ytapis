<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<meta name="description" content="Search YouTube videos — no API key required, powered by ytapis">
<title>ytapis — YouTube Search Demo</title>
<link rel="manifest" href="manifest.json">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  background: #0f0f0f;
  color: #f1f1f1;
  min-height: 100vh;
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #0f0f0f;
  border-bottom: 1px solid #303030;
  padding: 0 1rem;
}

.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 1rem;
  height: 56px;
}

.logo {
  font-size: 1.25rem;
  font-weight: 700;
  color: #f1f1f1;
  white-space: nowrap;
}

.logo span { color: #3ea6ff; }

.tabs {
  display: flex;
  gap: 0;
  margin-left: 1rem;
}

.tab-btn {
  background: none;
  border: none;
  color: #aaa;
  cursor: pointer;
  font-size: 0.875rem;
  font-weight: 500;
  padding: 0.5rem 0.75rem;
  border-radius: 8px;
  transition: background 0.15s, color 0.15s;
}

.tab-btn:hover { background: #272727; }
.tab-btn.active { background: #272727; color: #f1f1f1; }

.search-wrap {
  flex: 1;
  max-width: 600px;
  position: relative;
  margin-left: auto;
}

.search-wrap input {
  width: 100%;
  background: #121212;
  border: 1px solid #303030;
  border-radius: 20px;
  color: #f1f1f1;
  font-size: 0.875rem;
  padding: 0.5rem 2.5rem 0.5rem 1rem;
  outline: none;
  transition: border-color 0.2s;
}

.search-wrap input:focus {
  border-color: #3ea6ff;
}

.search-wrap input::placeholder { color: #888; }

.search-icon {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: #888;
  font-size: 0.9rem;
  pointer-events: none;
}

main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1rem;
}

.status {
  text-align: center;
  color: #888;
  padding: 3rem 1rem;
}

.status.error {
  color: #f44;
  background: rgba(255,0,0,0.08);
  border-radius: 12px;
  max-width: 500px;
  margin: 2rem auto;
  padding: 2rem;
}

.status.error .retry-btn {
  margin-top: 1rem;
  background: #3ea6ff;
  color: #0f0f0f;
  border: none;
  padding: 0.5rem 1.5rem;
  border-radius: 20px;
  font-weight: 600;
  cursor: pointer;
  font-size: 0.875rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1rem;
}

.card {
  cursor: pointer;
  transition: transform 0.15s;
}

.card:hover { transform: translateY(-2px); }

.thumb-wrap {
  position: relative;
  border-radius: 10px;
  overflow: hidden;
  background: #1a1a1a;
  aspect-ratio: 16 / 9;
}

.thumb-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.thumb-wrap .placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #555;
  font-size: 0.8rem;
  background: #1a1a1a;
}

.duration {
  position: absolute;
  bottom: 4px;
  right: 4px;
  background: rgba(0,0,0,0.85);
  color: #fff;
  font-size: 0.7rem;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: 0.3px;
}

.live-badge {
  position: absolute;
  bottom: 4px;
  right: 4px;
  background: #cc0000;
  color: #fff;
  font-size: 0.65rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  text-transform: uppercase;
}

.card-body {
  padding: 0.5rem 0;
  display: flex;
  gap: 0.5rem;
}

.card-body > div { min-width: 0; }

.card-body h3 {
  font-size: 0.875rem;
  font-weight: 500;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 0.25rem;
}

.meta {
  font-size: 0.75rem;
  color: #aaa;
  line-height: 1.5;
}

.meta span { display: block; }

.load-more-wrap {
  text-align: center;
  padding: 2rem 0;
}

.load-more-wrap button {
  background: #272727;
  color: #3ea6ff;
  border: 1px solid #3ea6ff;
  padding: 0.6rem 2rem;
  border-radius: 20px;
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}

.load-more-wrap button:hover { background: #3ea6ff; color: #0f0f0f; }
.load-more-wrap button:disabled { opacity: 0.5; cursor: default; }

.spinner {
  width: 24px;
  height: 24px;
  border: 2px solid #303030;
  border-top-color: #3ea6ff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  margin: 0 auto;
}

@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 640px) {
  .header-inner { gap: 0.5rem; }
  .tabs { margin-left: 0; }
  .tab-btn { padding: 0.4rem 0.5rem; font-size: 0.8rem; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">y<span>ta</span>pis</div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="trending">Trending</button>
      <button class="tab-btn" data-tab="search">Search</button>
      <button class="tab-btn" data-tab="shorts">Shorts</button>
      <button class="tab-btn" data-tab="channels">Channels</button>
    </div>
    <select id="region" style="background:#121212;color:#f1f1f1;border:1px solid #303030;border-radius:8px;padding:0.35rem 0.5rem;font-size:0.8rem;margin-right:0.5rem;outline:none">
      <option value="US|en">US</option>
      <option value="JP|ja">JP</option>
      <option value="KR|ko">KR</option>
      <option value="GB|en">GB</option>
      <option value="DE|de">DE</option>
      <option value="FR|fr">FR</option>
      <option value="IN|hi">IN</option>
      <option value="BR|pt">BR</option>
    </select>
    <div class="search-wrap" id="searchWrap" style="display:none">
      <input type="text" id="searchInput" placeholder="Search YouTube...">
      <span class="search-icon">&#x1F50D;</span>
    </div>
  </div>
</header>

<main id="main">
  <div class="status"><div class="spinner"></div></div>
</main>

<script>
const API = 'https://ytapis.djalokyt27.workers.dev';
let activeTab = 'trending';
let searchQuery = '';
let trendingCache = null;
let shortsCache = null;
let channelsCache = null;
let currentResults = [];
let loading = false;

const $main = document.getElementById('main');
const $searchWrap = document.getElementById('searchWrap');
const $searchInput = document.getElementById('searchInput');
const $region = document.getElementById('region');

function getRegion() {
  const [gl, hl] = $region.value.split('|');
  return { gl, hl };
}

function formatViews(raw) {
  if (!raw || raw === 0) return '';
  if (raw >= 1e9) return (raw / 1e9).toFixed(1).replace(/\.0$/, '') + 'B views';
  if (raw >= 1e6) return (raw / 1e6).toFixed(1).replace(/\.0$/, '') + 'M views';
  if (raw >= 1e3) return (raw / 1e3).toFixed(1).replace(/\.0$/, '') + 'K views';
  return raw.toLocaleString() + ' views';
}

function timeAgo(text) {
  if (!text) return '';
  return text;
}

function renderCard(video) {
  const v = video;
  let thumb = v.thumbnail || `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`;
  const isLive = v.isLive;
  const duration = v.duration || '';
  const title = v.title || `Video ${v.id}`;
  const author = v.author || 'YouTube';
  const views = formatViews(v.viewCountRaw);
  const published = timeAgo(v.publishedTime);

  return `
    <div class="card" onclick="window.open('https://www.youtube.com/watch?v=${v.id}', '_blank')" title="${title.replace(/"/g, '&quot;')}">
      <div class="thumb-wrap">
        <img src="${thumb}" alt="${title.replace(/"/g, '&quot;')}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="placeholder" style="display:none">No thumbnail</div>
        ${isLive ? '<div class="live-badge">LIVE</div>' : (duration ? `<div class="duration">${duration}</div>` : '')}
      </div>
      <div class="card-body">
        <div>
          <h3>${title}</h3>
          <div class="meta">
            <span>${author}${v.isVerified ? ' &#x2713;' : ''}</span>
            <span>${[views, published].filter(Boolean).join(' &middot; ')}</span>
          </div>
        </div>
      </div>
    </div>`;
}

function renderGrid(videos) {
  if (!videos.length) {
    return '<div class="status">No videos found. Try a different search.</div>';
  }
  return `<div class="grid">${videos.map(renderCard).join('')}</div>`;
}

function renderError(msg) {
  return `<div class="status error"><strong>Failed to load</strong><br>${msg}<br><button class="retry-btn" onclick="loadTab()">Retry</button></div>`;
}

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function loadTab() {
  if (loading) return;
  loading = true;
  $main.innerHTML = '<div class="status"><div class="spinner"></div></div>';

  const { gl, hl } = getRegion();
  try {
    if (activeTab === 'trending') {
      if (!trendingCache) {
        const data = await fetchJSON(`${API}/trending?limit=30&gl=${gl}&hl=${hl}`);
        trendingCache = data;
      }
      currentResults = trendingCache;
    } else if (activeTab === 'search' && searchQuery) {
      const data = await fetchJSON(`${API}/?q=${encodeURIComponent(searchQuery)}&limit=30&gl=${gl}&hl=${hl}`);
      currentResults = data;
    } else if (activeTab === 'shorts' && searchQuery) {
      const data = await fetchJSON(`${API}/shorts?q=${encodeURIComponent(searchQuery)}&limit=30&gl=${gl}&hl=${hl}`);
      currentResults = data.results || data;
    } else if (activeTab === 'channels' && searchQuery) {
      const data = await fetchJSON(`${API}/channel/${encodeURIComponent(searchQuery)}?limit=30`);
      currentResults = data.results || data;
    } else {
      currentResults = [];
    }
    $main.innerHTML = renderGrid(currentResults);
  } catch (err) {
    $main.innerHTML = renderError(err.message || 'Backend is unavailable');
  } finally {
    loading = false;
  }
}

function switchTab(tab) {
  if (activeTab === tab) return;
  activeTab = tab;
  $searchWrap.style.display = (tab === 'search' || tab === 'shorts' || tab === 'channels') ? '' : 'none';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if ((tab === 'search' || tab === 'shorts' || tab === 'channels') && $searchInput.value) {
    searchQuery = $searchInput.value;
  }
  if (tab === 'trending') {
    searchQuery = '';
    $searchInput.value = '';
  }
  loadTab();
}

$searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    searchQuery = $searchInput.value.trim();
    if (searchQuery) {
      if (activeTab === 'trending') {
        activeTab = 'search';
      }
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
      $searchWrap.style.display = '';
      currentResults = [];
      loadTab();
    }
  }
});

$region.addEventListener('change', () => {
  trendingCache = null;
  shortsCache = null;
  channelsCache = null;
  loadTab();
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

// Prefetch trending on load
fetch(`${API}/trending?limit=30&gl=US&hl=en`)
  .then(r => r.json())
  .then(data => { trendingCache = data; })
  .catch(() => {});
setTimeout(loadTab, 100);

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
