name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      - run: ruff check python/
      - run: pip install -e python/
      - run: pytest python/tests/ --tb=short

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        run: |
          cd go
          go build ./...
      - name: Vet
        run: |
          cd go
          go vet ./...
      - name: Test
        run: |
          cd go
          go test ./...

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.0"
      - run: cd dart && dart pub get
      - run: cd dart && dart analyze
      - run: cd dart && dart test

  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"
      - run: dotnet build csharp/ --configuration Release
      - run: dotnet test csharp/ --configuration Release --verbosity normal

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, json
      - run: composer install --working-dir=php/ --no-interaction
      - run: php -r "require 'php/src/Ytapis.php'; require 'php/src/VideoResult.php'; echo 'ytapis PHP OK' . PHP_EOL;"

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - run: gradle build -p kotlin/

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: cmake -B cpp/build -S cpp/ -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build cpp/build/
