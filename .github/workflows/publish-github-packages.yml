name: Publish to GitHub Packages

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - run: npm run build
      - name: Publish core to GitHub Packages
        run: |
          cd packages/core
          VER=$(jq -r '.version' package.json)
          if npm view "@pgboyahpgr-commits/ytapis-core@$VER" > /dev/null 2>&1; then
            echo "@pgboyahpgr-commits/ytapis-core@$VER already published, skipping"
            exit 0
          fi
          jq '.name = "@pgboyahpgr-commits/ytapis-core" | .publishConfig = {"registry": "https://npm.pkg.github.com/"}' package.json > tmp.json
          mv tmp.json package.json
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish cli to GitHub Packages
        run: |
          cd packages/cli
          VER=$(jq -r '.version' package.json)
          if npm view "@pgboyahpgr-commits/ytapis-cli@$VER" > /dev/null 2>&1; then
            echo "@pgboyahpgr-commits/ytapis-cli@$VER already published, skipping"
            exit 0
          fi
          jq '.name = "@pgboyahpgr-commits/ytapis-cli" | .publishConfig = {"registry": "https://npm.pkg.github.com/"}' package.json > tmp.json
          mv tmp.json package.json
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish mcp to GitHub Packages
        run: |
          cd packages/mcp
          VER=$(jq -r '.version' package.json)
          if npm view "@pgboyahpgr-commits/ytapis-mcp@$VER" > /dev/null 2>&1; then
            echo "@pgboyahpgr-commits/ytapis-mcp@$VER already published, skipping"
            exit 0
          fi
          jq '.name = "@pgboyahpgr-commits/ytapis-mcp" | .publishConfig = {"registry": "https://npm.pkg.github.com/"}' package.json > tmp.json
          mv tmp.json package.json
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
